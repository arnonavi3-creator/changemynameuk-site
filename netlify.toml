[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# Pages removed when the site became a free checklist (Nov 2026)
[[redirects]]
  from = "/pricing/*"
  to = "/check/"
  status = 301

[[redirects]]
  from = "/how-it-works/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/free-guide/*"
  to = "/check/"
  status = 301

[[redirects]]
  from = "/terms/*"
  to = "/"
  status = 301

# Inbox scanner (private beta): not indexed, and the browser may only talk to
# this site and Google, so inbox data has nowhere else to go.
[[headers]]
  for = "/scan/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; connect-src 'self' https://gmail.googleapis.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cache-Control = "no-cache"
